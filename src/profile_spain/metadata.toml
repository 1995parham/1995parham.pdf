#:schema https://raw.githubusercontent.com/yunanwg/brilliant-CV/main/metadata.toml.schema.json

# Spain profile — content lives under shared/, only the contact block differs
# between profiles. Switch via: typst compile cv.typ --input profile=spain
#
# The phone is the French Orange Holiday prepaid line, kept alive as a stable EU
# number until a Spanish SIM replaces it — a non-EU number on an EU application
# reads as "not actually here". The full postal address rides on `location`:
# brilliant-cv builds the header by looking up an icon per `personal.info` key,
# so an `address` key fails with `dictionary does not contain key "address"`.
# `location` is the supported field and already renders with the map-pin icon. The custom-visa entry states work authorization
# up front so recruiters do not screen this out as needing sponsorship.
#
# The visa line claims the permit, not the card: the residence authorisation
# under Ley 14/2013 runs to January 2029, and the resolution states it takes
# effect from the day it was issued rather than from the TIE being printed. It
# deliberately does not say "digital nomad" — that permit is for work performed
# for companies outside Spain, capped at 20% Spanish activity, and naming it
# invites the question in a screening call rather than in an interview. This
# repository is public; permit numbers stay out of it.

header_quote = "Senior Software & Platform Engineer · 10+ years building cloud-native systems"

cv_footer = "Curriculum vitae"
letter_footer = "Cover letter"

[layout]
    awesome_color = "#D97706"
    before_section_skip = "6pt"
    before_entry_skip = "4pt"
    before_entry_description_skip = "3pt"
    paper_size = "a4"
    date_width = "3.4cm"

    [layout.fonts]
        # XCharter is vendored under fonts/ (passed via --font-path), so it
        # resolves identically on macOS and in CI. Charter is the macOS twin.
        regular_fonts = ["XCharter", "Charter", "Libertinus Serif"]
        header_font = "XCharter"

    [layout.header]
        header_align = "left"
        display_profile_photo = true
        profile_photo_radius = "10%"
        info_font_size = "9.5pt"

    [layout.entry]
        # true: society bold on top, role below (also required for the
        # cv-entry-start / cv-entry-continued grouping used in professional.typ)
        display_entry_society_first = true
        display_logo = false

    [layout.section]
        title_highlight = "first-letters"
        title_highlight_letters = 3

    [layout.footer]
        display_page_counter = true
        display_footer = true

[inject]
    injected_keywords_list = [
        "Go", "Golang", "Python", "Kubernetes", "Docker", "NATS",
        "PostgreSQL", "MongoDB", "Cassandra", "Microservices",
        "Cloud Native", "Platform Engineering", "ArgoCD", "Terraform",
        "Helm", "Istio", "Linkerd", "Airflow", "FastAPI", "Django",
        "Prometheus", "Grafana", "OpenTelemetry", "GitOps", "AWS", "GCP",
        "Kafka", "Strimzi", "Knative", "KServe", "Rust", "Redis",
        "EKS", "ECS", "Lambda", "Vue", "Vue.js",
        "Cloud Run", "Vertex AI", "RAG", "Vector Database",
        "Semantic Search", "LLM", "SOC 2", "Compliance", "Edge", "Device Management",
    ]

[personal]
    first_name = "Parham"
    last_name = "Alvani"

    [personal.info]
        email = "parham.alvani@gmail.com"
        phone = "+33 6 74 98 82 96"
        homepage = "1995parham.me"
        github = "1995parham"
        location = "Avinguda Diagonal 571, 08029 Barcelona, Spain"

        [personal.info.custom-degree]
            awesomeIcon = "graduation-cap"
            text = "Ph.D. in Computer Network"

        [personal.info.custom-visa]
            awesomeIcon = "passport"
            text = "Spain residence permit to 2029 — no sponsorship required"
